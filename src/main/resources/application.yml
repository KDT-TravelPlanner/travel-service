spring:
  application:
    name: travel-planner-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_diary_dev}
    username: ${SPRING_DATASOURCE_USERNAME:travel_diary}
    password: ${SPRING_DATASOURCE_PASSWORD:travel_diary_password}
  flyway:
    create-schemas: true
    default-schema: travel
    schemas: travel
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  devtools:
    restart:
      poll-interval: 2s
      quiet-period: 1s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    accesslog:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  paths-to-match:
    - /api/v1/**
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    try-it-out-enabled: true
    persist-authorization: false
    disable-swagger-default-url: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

app:
  external:
    maps:
      base-url: ${MAPS_SERVICE_BASE_URL:http://localhost:8082}
    identity:
      base-url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8081}
      connect-timeout: ${IDENTITY_SERVICE_CONNECT_TIMEOUT:2s}
      read-timeout: ${IDENTITY_SERVICE_READ_TIMEOUT:3s}
  logging:
    error-frame-limit: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:identity-service}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}

logging:
  level:
    root: "WARN"
    com.ktcloud.travelplanner.global.logging.ApplicationLogger: "INFO"
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.security: "WARN"
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: "OFF"
    org.springframework.web.filter.CommonsRequestLoggingFilter: "OFF"
    org.apache.coyote.http11.Http11InputBuffer: "OFF"
    org.apache.hc.client5.http.wire: "OFF"
    org.apache.http.wire: "OFF"
    reactor.netty.http.client: "OFF"
  structured:
    json:
      include: "@timestamp,ecs,ecs.version,log,log.level,log.logger,process,process.pid,process.thread,process.thread.name,service,service.name,service.environment,message,event,requestId,method,route,status,durationMs,outcome,errorCode,errorType,errorFingerprint,errorFrames"
