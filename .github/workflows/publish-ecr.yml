name: Travel ECR Publish

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish Travel Image
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build application JAR
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      - name: Validate release configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "${AWS_REGION}"
          test -n "${ECR_REPOSITORY_URL}"
          test -n "${AWS_ECR_PUBLISH_ROLE_ARN}"
          case "${ECR_REPOSITORY_URL}" in
            https://*|http://*) echo "ECR_REPOSITORY_URL must not include a scheme" >&2; exit 1 ;;
          esac

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          role-session-name: travel-ecr-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: image
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "${image_uri}" \
            --push \
            --provenance=false \
            --metadata-file "${RUNNER_TEMP}/travel-image-metadata.json" \
            .
          repository_name="${ECR_REPOSITORY_URL#*/}"
          digest="$(aws ecr describe-images \
            --repository-name "${repository_name}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${digest}" != "None"
          echo "image_uri=${ECR_REPOSITORY_URL}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record published digest
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          {
            echo "### Travel ECR publish"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_URI}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
