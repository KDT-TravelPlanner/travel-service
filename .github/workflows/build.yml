name: Travel 도커 이미지 및 HTTP Adapter 검증

on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "codex/**"
      - "fix/**"
      - "SCRUM-*"

permissions:
  contents: read
  packages: read

concurrency:
  group: travel-docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: travel_diary_dev
          POSTGRES_USER: travel_diary
          POSTGRES_PASSWORD: travel_diary_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_diary -d travel_diary_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 1단계 단위 테스트
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew clean test --no-daemon

      - name: 2단계 통합 테스트
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew integrationTest --no-daemon

      - name: 3단계 HTTP Adapter 테스트
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew adapterTest --no-daemon

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: 애플리케이션 JAR 생성
        env:
          GITHUB_PACKAGES_USER: ${{ secrets.COMMON_PACKAGES_USER }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.COMMON_PACKAGES_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      - name: 4단계 도커 이미지 빌드
        run: docker build --tag travel-service:ci .

      - name: 5-6단계 도커 컨테이너 기동 및 Health 검증
        run: |
          set -euo pipefail
          docker run -d --name travel-service-ci \
            --add-host host.docker.internal:host-gateway \
            -p 18081:8080 \
            -p 19091:9091 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e JWT_ISSUER=identity-service \
            -e JWT_SECRET=ci-only-jwt-secret-with-at-least-32-bytes \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/travel_diary_dev \
            -e SPRING_DATASOURCE_USERNAME=travel_diary \
            -e SPRING_DATASOURCE_PASSWORD=travel_diary_password \
            -e LOGGING_FILE_NAME=/var/log/travel-planner/travel-planner.log \
            travel-service:ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19091/actuator/health/readiness >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "readiness 대기 120초 초과" >&2
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://127.0.0.1:19091/actuator/health \
            | jq --exit-status '.status == "UP"' >/dev/null
          curl --fail --silent http://127.0.0.1:19091/actuator/health/readiness \
            | jq --exit-status '.status == "UP"' >/dev/null
          curl --fail --silent http://127.0.0.1:18081/api/ping \
            | jq --exit-status '.status == "ok" and .profile == "prod"' >/dev/null

      - name: 컨테이너 재시작 여부 확인
        run: |
          set -euo pipefail
          restart_count="$(docker inspect --format '{{.RestartCount}}' travel-service-ci)"
          test "${restart_count}" = "0"

      - name: 진단 로그 수집
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/container-diagnostics"
          docker logs travel-service-ci > "${RUNNER_TEMP}/container-diagnostics/app.log" 2>&1 || true
          docker inspect travel-service-ci > "${RUNNER_TEMP}/container-diagnostics/inspect.json" 2>&1 || true

      - name: 진단 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: travel-container-diagnostics
          path: ${{ runner.temp }}/container-diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: 도커 컨테이너 정리
        if: always()
        run: docker rm -f travel-service-ci 2>/dev/null || true
